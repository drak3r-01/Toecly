name: Build & Release

# Runs when a version tag (e.g. v0.1.0) is pushed, never on a plain push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/validate_questions.dart
      - run: flutter analyze
      - run: flutter test
      # Release signing key, from GitHub secrets. Without them the APK is signed with the debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key, so it cannot update a previously installed release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk toecly-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: toecly-android-apk
          path: toecly-${{ github.ref_name }}.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/validate_questions.dart
      - run: flutter build windows --release
      # The .exe needs the DLLs and the data/ folder next to it: zip everything.
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath toecly-${{ github.ref_name }}-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: toecly-windows-zip
          path: toecly-${{ github.ref_name }}-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # v0.1.0-alpha.1 gives the release "Alpha 1", flagged as a pre-release. A plain v1.0.0 keeps its tag as name.
      - name: Name the release
        id: meta
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=$(echo "${tag#*-}" | sed -E 's/^([a-z])([a-z]*)\.?([0-9]*)$/\U\1\E\2 \3/')" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: dist/*
          generate_release_notes: true
