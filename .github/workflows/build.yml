name: Build & Release

# Runs when a version tag (e.g. v0.1.0 or V0.1.0) is pushed, never on a plain push.
on:
  push:
    tags: ["v*", "V*"]

# Read-only by default: only the release job may write.
permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/validate_questions.dart
      - run: dart run tool/validate_words.dart
      - run: flutter analyze
      - run: flutter test
      # Release signing key, from GitHub secrets. A final release (no "-" in the tag) must never be
      # signed with the throwaway debug key: Android would refuse to update over it.
      - name: Configure release signing
        env:
          TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [[ "$TAG" == *-* ]]; then
              echo "::warning::Missing signing secrets (${missing# }): this pre-release APK is signed with the debug key and cannot update a previously installed release."
              exit 0
            fi
            echo "::error::Missing signing secrets (${missing# }). Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions. Refusing to publish a final release signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          # Fails now (not at the end of a 10-minute build) on a wrong password or alias.
          keytool -list -keystore android/app/release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # Version name = tag without the leading "v" and any pre-release suffix; build number = run number,
      # so every release has a higher Android versionCode than the previous one.
      - name: Build APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#[vV]}"
          flutter build apk --release --build-name="${version%%-*}" --build-number="$GITHUB_RUN_NUMBER"
      - name: Name the APK
        env:
          TAG: ${{ github.ref_name }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "toecly-$TAG.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toecly-android-apk
          path: toecly-*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/validate_questions.dart
      - run: dart run tool/validate_words.dart
      - name: Build Windows app
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ($env:TAG -replace '^[vV]', '') -replace '-.*$', ''
          flutter build windows --release --build-name=$version --build-number=$env:GITHUB_RUN_NUMBER
      # The .exe needs the DLLs and the data/ folder next to it: zip everything.
      - name: Zip Windows app
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "toecly-$env:TAG-windows.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toecly-windows-zip
          path: toecly-*-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      # v0.1.0-alpha.1 gives the release "Alpha 1", flagged as a pre-release. A plain v1.0.0 keeps its tag as name.
      - name: Name the release
        id: meta
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=$(echo "${tag#*-}" | sed -E 's/^([a-z])([a-z]*)\.?([0-9]*)$/\U\1\E\2 \3/')" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi
      # Lets anyone check a downloaded file: sha256sum -c SHA256SUMS.txt
      - name: Publish checksums
        working-directory: dist
        run: sha256sum toecly-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: dist/*
          generate_release_notes: true
