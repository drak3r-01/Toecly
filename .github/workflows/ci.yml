name: CI

# Checks every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate question lots
        run: dart run tool/validate_questions.dart
      - run: flutter analyze
      - run: flutter test
