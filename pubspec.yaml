name: toecly
description: "Offline TOEIC Reading practice"
publish_to: 'none'

# Releases override both with --build-name / --build-number (see .github/workflows/build.yml).
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  go_router: ^18.1.4
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  clock: ^1.1.2
  flutter_svg: ^2.2.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # generates lib/l10n/app_localizations*.dart from the .arb files

  # Assets are not read recursively: one folder per part.
  # Adding a JSON file to one of these folders is enough, no need to touch this list.
  assets:
    - assets/questions/part5/
    - assets/questions/part6/
    - assets/questions/part7/
    - assets/words/
    - assets/brand/

  # Variable fonts (SIL OFL 1.1, licenses next to the files). Weight, width and
  # optical size are driven by FontVariation, e.g. in the animated splash.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-VF.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-VF.ttf
